name: CI
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate artefacts and check they are committed
        run: |
          python3 tools/gen.py
          git diff --exit-code -- components/thermia_bus/registers_gen.cpp docs/REGISTERS.md config/entities/thermia_entities.yaml
      - name: Host unit tests (C++17, -Werror)
        run: bash tests/run_tests.sh

  esphome:
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome 2026.10.1
        run: pip install "esphome==2026.10.1"
      - name: Create secrets with a random API key (compile only, never shipped)
        run: |
          KEY="$(openssl rand -base64 32)"
          sed "s#REPLACE-ME-with-openssl-rand-base64-32#${KEY}#" config/secrets.yaml.example > config/secrets.yaml
          grep -q 'REPLACE-ME' config/secrets.yaml && exit 1 || true
      - name: Compile firmware
        run: esphome compile config/thermia-relay.yaml
