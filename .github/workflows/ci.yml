name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Translations are up to date
        run: |
          python tools/build_translations.py
          git diff --exit-code -- custom_components/thermia_itec_eco/strings.json custom_components/thermia_itec_eco/translations
